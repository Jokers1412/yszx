[project]
name = "yszx-backend"
version = "0.1.0"
description = "云枢智学 · FastAPI 模块化单体后端（设计依据 docs/design/02.整体架构设计.md）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2.0",
    "cryptography>=42.0",  # PyMySQL 连 MySQL 8 caching_sha2_password 认证所需
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "xlrd>=2.0",  # .xls 导入解析（openpyxl 仅支持 .xlsx）
    "minio>=7.2",
    "tzdata>=2024.1",  # Windows 无 IANA 时区库（zoneinfo 依赖）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
