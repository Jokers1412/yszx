# Alembic 迁移配置（数据库结构以 scripts/sql/schema.sql 为基线；
# 首次使用请执行 `alembic stamp head` 建立基线，后续变更经迁移管理）
[alembic]
script_location = alembic
prepend_sys_path = .
# 连接串由 alembic/env.py 从 app.core.config 读取（与应用共用 .env）
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
