<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找回密码 - 云枢智学</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/portal.css">
<style>
  .auth-page { min-height: calc(100vh - var(--header-h)); }
  .auth-aside .logo { color: #fff; margin-bottom: 28px; }
  .auth-card { width: 460px; }
  /* 顶部横向步骤条 */
  .steps-h { flex-direction: row; gap: 0; margin: 20px 0 24px; }
  .steps-h .step { flex: 1; padding-bottom: 0; align-items: center; gap: 8px; }
  .steps-h .step::before { display: none; }
  .steps-h .step .step-name { font-size: 13px; }
  /* 分步面板淡入 */
  @keyframes fp-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fp-panel { animation: fp-fade .25s ease; }
  .code-row { display: flex; gap: 8px; }
  .code-row .input { flex: 1; }
  .fp-done { text-align: center; padding: 18px 0 8px; }
  .fp-done .ok-icon {
    width: 72px; height: 72px; border-radius: 50%; background: var(--success-bg); color: var(--success);
    display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 16px;
    border: 2px solid var(--success);
  }
  .fp-done h3 { font-size: 20px; margin-bottom: 6px; }
  .fp-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
</style>
</head>
<body data-page="forgot">
<header id="site-header"></header>

<div class="auth-page">
  <!-- 左侧引导区 -->
  <aside class="auth-aside">
    <div class="logo"><span class="logo-mark">云</span>云枢智学</div>
    <h2>AI 赋能的智能面试训练平台</h2>
    <p>海量题库 × AI 模拟面试 × 学习路线，助你高效备战技术面试。</p>
    <div class="steps">
      <div class="step">
        <div class="step-dot">1</div>
        <div>
          <div class="step-name">选择技术方向</div>
          <div class="step-desc">8 大 AI 技术方向任你选</div>
        </div>
      </div>
      <div class="step">
        <div class="step-dot">2</div>
        <div>
          <div class="step-name">开始刷题练习</div>
          <div class="step-desc">海量题库随时随地练习</div>
        </div>
      </div>
      <div class="step">
        <div class="step-dot">3</div>
        <div>
          <div class="step-name">AI 面试检验</div>
          <div class="step-desc">模拟面试输出能力报告</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- 右侧三步向导 -->
  <main class="auth-main">
    <div class="auth-card">
      <h1 class="auth-title">找回密码</h1>
      <p class="auth-sub">通过手机验证码重置你的登录密码</p>

      <div class="steps steps-h" id="fp-steps">
        <div class="step active" data-s="1">
          <div class="step-dot">1</div>
          <div><div class="step-name">验证手机</div></div>
        </div>
        <div class="step" data-s="2">
          <div class="step-dot">2</div>
          <div><div class="step-name">重置密码</div></div>
        </div>
        <div class="step" data-s="3">
          <div class="step-dot">3</div>
          <div><div class="step-name">完成</div></div>
        </div>
      </div>

      <!-- 步骤 1：验证手机 -->
      <div class="fp-panel" data-p="1">
        <form id="fp-form-1" novalidate>
          <div class="field">
            <label class="field-label" for="fp-phone">手机号</label>
            <input class="input" id="fp-phone" placeholder="请输入 11 位手机号" maxlength="11">
            <div class="field-error" id="fp-phone-err"></div>
          </div>
          <div class="field">
            <label class="field-label" for="fp-code">验证码</label>
            <div class="code-row">
              <input class="input" id="fp-code" placeholder="请输入 6 位验证码" maxlength="6">
              <button class="btn" type="button" id="fp-send-btn">获取验证码</button>
            </div>
            <div class="field-error" id="fp-code-err"></div>
          </div>
          <div class="fp-actions">
            <button class="btn btn-primary btn-lg" type="submit">下一步</button>
            <a class="btn btn-ghost" href="login.html">返回登录</a>
          </div>
        </form>
      </div>

      <!-- 步骤 2：重置密码 -->
      <div class="fp-panel" data-p="2" hidden>
        <form id="fp-form-2" novalidate>
          <div class="field">
            <label class="field-label" for="fp-pwd">新密码</label>
            <input class="input" type="password" id="fp-pwd" placeholder="请输入新密码（至少 6 位）" autocomplete="new-password">
            <div class="field-error" id="fp-pwd-err"></div>
          </div>
          <div class="field">
            <label class="field-label" for="fp-pwd2">确认密码</label>
            <input class="input" type="password" id="fp-pwd2" placeholder="请再次输入新密码" autocomplete="new-password">
            <div class="field-error" id="fp-pwd2-err"></div>
          </div>
          <div class="fp-actions">
            <button class="btn btn-primary btn-lg" type="submit">下一步</button>
          </div>
        </form>
      </div>

      <!-- 步骤 3：完成 -->
      <div class="fp-panel" data-p="3" hidden>
        <div class="fp-done">
          <div class="ok-icon">✓</div>
          <h3>重置成功</h3>
          <p class="muted">你的密码已重置，请使用新密码登录</p>
          <div class="fp-actions">
            <a class="btn btn-primary btn-lg" href="login.html">立即登录</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<footer id="site-footer"></footer>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/portal.js"></script>
<script>
(function () {
  "use strict";

  function setErr(input, errEl, msg) {
    if (msg) { input.classList.add("error"); errEl.textContent = msg; }
    else { input.classList.remove("error"); errEl.textContent = ""; }
  }

  /* ---------- 步骤切换（带淡入） ---------- */
  var stepEls = UI.$$("#fp-steps .step");
  var panels = UI.$$(".fp-panel");
  function gotoStep(n) {
    stepEls.forEach(function (el) {
      var i = Number(el.dataset.s);
      el.classList.toggle("active", i === n);
      el.classList.toggle("done", i < n);
    });
    panels.forEach(function (p) {
      var show = Number(p.dataset.p) === n;
      p.hidden = !show;
      if (show) {
        /* 重新触发淡入动画 */
        p.style.animation = "none";
        void p.offsetWidth;
        p.style.animation = "";
      }
    });
  }

  /* ---------- 步骤 1：验证手机 ---------- */
  var phoneInput = document.getElementById("fp-phone");
  var codeInput = document.getElementById("fp-code");
  var phoneErr = document.getElementById("fp-phone-err");
  var codeErr = document.getElementById("fp-code-err");
  var sendBtn = document.getElementById("fp-send-btn");

  sendBtn.addEventListener("click", function () {
    var phone = phoneInput.value.trim();
    if (!phone) { setErr(phoneInput, phoneErr, "请输入手机号"); return; }
    if (!/^1\d{10}$/.test(phone)) { setErr(phoneInput, phoneErr, "请输入正确的 11 位手机号"); return; }
    setErr(phoneInput, phoneErr, "");
    UI.countdown(sendBtn, 60);
    UI.toast("验证码已发送");
  });

  document.getElementById("fp-form-1").addEventListener("submit", function (e) {
    e.preventDefault();
    var phone = phoneInput.value.trim();
    var code = codeInput.value.trim();
    var ok = true;
    if (!phone) { setErr(phoneInput, phoneErr, "请输入手机号"); ok = false; }
    else if (!/^1\d{10}$/.test(phone)) { setErr(phoneInput, phoneErr, "请输入正确的 11 位手机号"); ok = false; }
    else setErr(phoneInput, phoneErr, "");
    if (!code) { setErr(codeInput, codeErr, "请输入验证码"); ok = false; }
    else if (!/^\d{6}$/.test(code)) { setErr(codeInput, codeErr, "请输入 6 位验证码"); ok = false; }
    else setErr(codeInput, codeErr, "");
    if (!ok) return;
    gotoStep(2);
  });

  /* ---------- 步骤 2：重置密码 ---------- */
  var pwdInput = document.getElementById("fp-pwd");
  var pwd2Input = document.getElementById("fp-pwd2");
  var pwdErr = document.getElementById("fp-pwd-err");
  var pwd2Err = document.getElementById("fp-pwd2-err");

  document.getElementById("fp-form-2").addEventListener("submit", function (e) {
    e.preventDefault();
    var pwd = pwdInput.value;
    var pwd2 = pwd2Input.value;
    var ok = true;
    if (!pwd) { setErr(pwdInput, pwdErr, "请输入新密码"); ok = false; }
    else if (pwd.length < 6) { setErr(pwdInput, pwdErr, "密码长度不能少于 6 位"); ok = false; }
    else setErr(pwdInput, pwdErr, "");
    if (!pwd2) { setErr(pwd2Input, pwd2Err, "请再次输入新密码"); ok = false; }
    else if (pwd2 !== pwd) { setErr(pwd2Input, pwd2Err, "两次输入的密码不一致"); ok = false; }
    else setErr(pwd2Input, pwd2Err, "");
    if (!ok) return;
    gotoStep(3);
    UI.toast("密码重置成功");
  });

  /* 初始状态 */
  gotoStep(1);
})();
</script>
</body>
</html>
