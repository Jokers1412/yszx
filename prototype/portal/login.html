<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - 云枢智学</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/portal.css">
<style>
  .auth-page { min-height: calc(100vh - var(--header-h)); }
  .auth-aside .logo { color: #fff; margin-bottom: 28px; }
  .code-row { display: flex; gap: 8px; }
  .code-row .input { flex: 1; }
  .demo-hint { text-align: center; font-size: 12px; color: var(--ink-3); margin-top: 8px; line-height: 1.7; }
</style>
</head>
<body data-page="login">
<header id="site-header"></header>

<div class="auth-page">
  <!-- 左侧引导区 -->
  <aside class="auth-aside">
    <div class="logo"><span class="logo-mark">云</span>云枢智学</div>
    <h2>AI 赋能的智能面试训练平台</h2>
    <p>海量题库 × AI 模拟面试 × 学习路线，助你高效备战技术面试。</p>
    <div class="steps">
      <div class="step">
        <div class="step-dot">1</div>
        <div>
          <div class="step-name">选择技术方向</div>
          <div class="step-desc">8 大 AI 技术方向任你选</div>
        </div>
      </div>
      <div class="step">
        <div class="step-dot">2</div>
        <div>
          <div class="step-name">开始刷题练习</div>
          <div class="step-desc">海量题库随时随地练习</div>
        </div>
      </div>
      <div class="step">
        <div class="step-dot">3</div>
        <div>
          <div class="step-name">AI 面试检验</div>
          <div class="step-desc">模拟面试输出能力报告</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- 右侧登录区 -->
  <main class="auth-main">
    <div class="auth-card">
      <h1 class="auth-title">欢迎回来</h1>
      <p class="auth-sub">登录云枢智学，继续你的学习之旅</p>

      <div id="lock-alert"></div>

      <div class="auth-tabs">
        <button class="tab active" type="button" id="tab-pwd">账号密码登录</button>
        <button class="tab" type="button" id="tab-sms">手机验证码登录</button>
      </div>

      <!-- 账号密码登录 -->
      <form id="pwd-form" novalidate>
        <div class="field">
          <label class="field-label" for="acc-input">手机号 / 邮箱</label>
          <input class="input" id="acc-input" placeholder="请输入手机号或邮箱" autocomplete="username">
          <div class="field-error" id="acc-err"></div>
        </div>
        <div class="field">
          <label class="field-label" for="pwd-input">密码</label>
          <input class="input" type="password" id="pwd-input" placeholder="请输入密码" autocomplete="current-password">
          <div class="field-error" id="pwd-err"></div>
        </div>
        <div class="flex-between mb-16">
          <label class="checkbox-row"><input type="checkbox" id="remember-me" checked> 记住我</label>
          <a href="forgot-password.html">忘记密码？</a>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="pwd-login-btn">登录</button>
      </form>

      <!-- 手机验证码登录 -->
      <form id="sms-form" hidden novalidate>
        <div class="field">
          <label class="field-label" for="sms-phone">手机号</label>
          <input class="input" id="sms-phone" placeholder="请输入手机号" maxlength="11" autocomplete="username">
          <div class="field-error" id="sms-phone-err"></div>
        </div>
        <div class="field">
          <label class="field-label" for="sms-code">验证码</label>
          <div class="code-row">
            <input class="input" id="sms-code" placeholder="请输入验证码" maxlength="6">
            <button class="btn" type="button" id="sms-send-btn">获取验证码</button>
          </div>
          <div class="field-error" id="sms-code-err"></div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="sms-login-btn">登录</button>
      </form>

      <div class="third-divider">其他登录方式</div>
      <div class="third-login">
        <button class="third-btn" type="button" title="微信登录">💬</button>
        <button class="third-btn" type="button" title="QQ登录">🐧</button>
        <button class="third-btn" type="button" title="GitHub登录">🐙</button>
      </div>

      <div class="auth-foot">还没有账号？<a href="register.html">立即注册</a></div>
      <div class="demo-hint muted">
        原型演示：任意账号密码均可登录<br>
        <span class="muted">演示提示：密码输入 000000 可模拟密码错误（连续 5 次触发账号锁定）</span>
      </div>
    </div>
  </main>
</div>

<footer id="site-footer"></footer>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/portal.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- 工具 ---------- */
  function setErr(input, errEl, msg) {
    if (msg) { input.classList.add("error"); errEl.textContent = msg; }
    else { input.classList.remove("error"); errEl.textContent = ""; }
  }
  function isPhone(v) { return /^1\d{10}$/.test(v); }
  function getRedirect() {
    var m = location.search.match(/[?&]redirect=([^&]*)/);
    return m ? decodeURIComponent(m[1]) : "";
  }

  /* ---------- Tab 切换 ---------- */
  var tabPwd = document.getElementById("tab-pwd");
  var tabSms = document.getElementById("tab-sms");
  var pwdForm = document.getElementById("pwd-form");
  var smsForm = document.getElementById("sms-form");
  function switchTab(name) {
    var isPwd = name === "pwd";
    tabPwd.classList.toggle("active", isPwd);
    tabSms.classList.toggle("active", !isPwd);
    pwdForm.hidden = !isPwd;
    smsForm.hidden = isPwd;
  }
  tabPwd.addEventListener("click", function () { switchTab("pwd"); });
  tabSms.addEventListener("click", function () { switchTab("sms"); });

  /* ---------- 登录失败锁定（连续 5 次密码错误锁定 5 分钟） ---------- */
  var failCount = 0;
  var locked = false;
  var lockTimer = null;
  var pwdLoginBtn = document.getElementById("pwd-login-btn");
  var smsLoginBtn = document.getElementById("sms-login-btn");
  var lockAlert = document.getElementById("lock-alert");

  function lockAccount() {
    locked = true;
    lockAlert.innerHTML = '<div class="alert alert-error">账号已锁定，请 5 分钟后重试</div>';
    pwdLoginBtn.disabled = true;
    smsLoginBtn.disabled = true;
    clearTimeout(lockTimer);
    lockTimer = setTimeout(function () {
      locked = false;
      failCount = 0;
      lockAlert.innerHTML = "";
      pwdLoginBtn.disabled = false;
      smsLoginBtn.disabled = false;
      UI.toast("账号已解除锁定，请重新登录");
    }, 5 * 60 * 1000);
  }
  function onWrongPassword(errEl, input) {
    failCount += 1;
    if (failCount >= 5) {
      lockAccount();
      UI.toast("账号已锁定，请 5 分钟后重试", "error");
      return;
    }
    setErr(input, errEl, "账号或密码错误，还可尝试 " + (5 - failCount) + " 次");
    UI.toast("密码错误", "error");
  }
  function loginSuccess() {
    failCount = 0;
    YS.auth.login(DB.user);
    UI.toast("登录成功");
    var redirect = getRedirect();
    setTimeout(function () {
      location.href = redirect && redirect.indexOf("http") !== 0 ? redirect : "index.html";
    }, 600);
  }

  /* ---------- 账号密码登录 ---------- */
  var accInput = document.getElementById("acc-input");
  var pwdInput = document.getElementById("pwd-input");
  var accErr = document.getElementById("acc-err");
  var pwdErr = document.getElementById("pwd-err");

  pwdForm.addEventListener("submit", function (e) {
    e.preventDefault();
    if (locked) return;
    var acc = accInput.value.trim();
    var pwd = pwdInput.value;
    var ok = true;
    if (!acc) { setErr(accInput, accErr, "请输入手机号或邮箱"); ok = false; }
    else setErr(accInput, accErr, "");
    if (!pwd) { setErr(pwdInput, pwdErr, "请输入密码"); ok = false; }
    else setErr(pwdInput, pwdErr, "");
    if (!ok) return;
    /* 原型演示：任意账号密码均可登录；密码为 000000 时模拟密码错误 */
    if (pwd === "000000") { onWrongPassword(pwdErr, pwdInput); return; }
    loginSuccess();
  });

  /* ---------- 手机验证码登录 ---------- */
  var smsPhone = document.getElementById("sms-phone");
  var smsCode = document.getElementById("sms-code");
  var smsPhoneErr = document.getElementById("sms-phone-err");
  var smsCodeErr = document.getElementById("sms-code-err");
  var smsSendBtn = document.getElementById("sms-send-btn");

  smsSendBtn.addEventListener("click", function () {
    var phone = smsPhone.value.trim();
    if (!phone) { setErr(smsPhone, smsPhoneErr, "请输入手机号"); return; }
    if (!isPhone(phone)) { setErr(smsPhone, smsPhoneErr, "请输入正确的 11 位手机号"); return; }
    setErr(smsPhone, smsPhoneErr, "");
    UI.countdown(smsSendBtn, 60);
    UI.toast("验证码已发送");
  });

  smsForm.addEventListener("submit", function (e) {
    e.preventDefault();
    if (locked) return;
    var phone = smsPhone.value.trim();
    var code = smsCode.value.trim();
    var ok = true;
    if (!phone) { setErr(smsPhone, smsPhoneErr, "请输入手机号"); ok = false; }
    else if (!isPhone(phone)) { setErr(smsPhone, smsPhoneErr, "请输入正确的 11 位手机号"); ok = false; }
    else setErr(smsPhone, smsPhoneErr, "");
    if (!code) { setErr(smsCode, smsCodeErr, "请输入验证码"); ok = false; }
    else if (!/^\d{6}$/.test(code)) { setErr(smsCode, smsCodeErr, "请输入 6 位验证码"); ok = false; }
    else setErr(smsCode, smsCodeErr, "");
    if (!ok) return;
    loginSuccess();
  });

  /* ---------- 第三方登录（原型占位） ---------- */
  UI.$$(".third-btn").forEach(function (b) {
    b.addEventListener("click", function () {
      UI.toast("原型占位：第三方登录暂未接入", "warn");
    });
  });
})();
</script>
</body>
</html>
