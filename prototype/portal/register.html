<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 - 云枢智学</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/portal.css">
<style>
  .auth-page { min-height: calc(100vh - var(--header-h)); }
  .auth-aside .logo { color: #fff; margin-bottom: 28px; }
  .code-row { display: flex; gap: 8px; }
  .code-row .input { flex: 1; }
  .agree-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--ink-2); margin-bottom: 16px; }
  .agree-row input { margin-top: 3px; width: 15px; height: 15px; accent-color: var(--brand); cursor: pointer; }
</style>
</head>
<body data-page="register">
<header id="site-header"></header>

<div class="auth-page">
  <!-- 左侧三步引导（仅第 1 步激活） -->
  <aside class="auth-aside">
    <div class="logo"><span class="logo-mark">云</span>云枢智学</div>
    <h2>三步开启你的求职训练</h2>
    <p>注册后即可刷题练习、AI 模拟面试，一站式备战技术面试。</p>
    <div class="steps">
      <div class="step active">
        <div class="step-dot">1</div>
        <div>
          <div class="step-name">创建账号</div>
          <div class="step-desc">手机号验证，激活你的账号</div>
        </div>
      </div>
      <div class="step">
        <div class="step-dot">2</div>
        <div>
          <div class="step-name">完善信息</div>
          <div class="step-desc">完善个人资料，选择技术方向</div>
        </div>
      </div>
      <div class="step">
        <div class="step-dot">3</div>
        <div>
          <div class="step-name">开始训练</div>
          <div class="step-desc">刷题练习，AI 面试检验成果</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- 右侧注册表单 -->
  <main class="auth-main">
    <div class="auth-card">
      <h1 class="auth-title">创建账号</h1>
      <p class="auth-sub">注册云枢智学，开启智能面试训练之旅</p>

      <form id="reg-form" novalidate>
        <div class="field">
          <label class="field-label" for="reg-phone">手机号</label>
          <input class="input" id="reg-phone" placeholder="请输入 11 位手机号" maxlength="11">
          <div class="field-error" id="reg-phone-err"></div>
        </div>
        <div class="field">
          <label class="field-label" for="reg-code">验证码</label>
          <div class="code-row">
            <input class="input" id="reg-code" placeholder="请输入 6 位验证码" maxlength="6">
            <button class="btn" type="button" id="reg-send-btn">获取验证码</button>
          </div>
          <div class="field-error" id="reg-code-err"></div>
        </div>
        <div class="field">
          <label class="field-label" for="reg-pwd">设置密码</label>
          <input class="input" type="password" id="reg-pwd" placeholder="建议 6-20 位，含大小写字母、数字与特殊字符" autocomplete="new-password">
          <div class="strength-meter" id="reg-strength">
            <div class="seg"></div><div class="seg"></div><div class="seg"></div>
          </div>
          <div class="strength-text" id="reg-strength-text"></div>
          <div class="field-error" id="reg-pwd-err"></div>
        </div>
        <div class="field">
          <label class="field-label" for="reg-pwd2">确认密码</label>
          <input class="input" type="password" id="reg-pwd2" placeholder="请再次输入密码" autocomplete="new-password">
          <div class="field-error" id="reg-pwd2-err"></div>
        </div>
        <div class="agree-row">
          <input type="checkbox" id="reg-agree">
          <label for="reg-agree">我已阅读并同意<a href="javascript:void(0)" data-agree="用户协议">《用户协议》</a>和<a href="javascript:void(0)" data-agree="隐私政策">《隐私政策》</a></label>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">注册</button>
      </form>

      <div class="auth-foot">已有账号？<a href="login.html">立即登录</a></div>
      <div class="auth-foot muted">原型演示：注册信息仅保存在本地浏览器，不会上传</div>
    </div>
  </main>
</div>

<footer id="site-footer"></footer>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/portal.js"></script>
<script>
(function () {
  "use strict";

  function setErr(input, errEl, msg) {
    if (msg) { input.classList.add("error"); errEl.textContent = msg; }
    else { input.classList.remove("error"); errEl.textContent = ""; }
  }

  var phoneInput = document.getElementById("reg-phone");
  var codeInput = document.getElementById("reg-code");
  var pwdInput = document.getElementById("reg-pwd");
  var pwd2Input = document.getElementById("reg-pwd2");
  var agreeInput = document.getElementById("reg-agree");
  var phoneErr = document.getElementById("reg-phone-err");
  var codeErr = document.getElementById("reg-code-err");
  var pwdErr = document.getElementById("reg-pwd-err");
  var pwd2Err = document.getElementById("reg-pwd2-err");
  var sendBtn = document.getElementById("reg-send-btn");
  var meter = document.getElementById("reg-strength");
  var meterText = document.getElementById("reg-strength-text");

  /* 初始渲染强度条提示 */
  UI.renderStrength(meter, meterText, "");

  /* 密码强度实时更新（弱 / 中 / 强） */
  pwdInput.addEventListener("input", function () {
    UI.renderStrength(meter, meterText, pwdInput.value);
  });

  /* 获取验证码：60 秒倒计时 */
  sendBtn.addEventListener("click", function () {
    var phone = phoneInput.value.trim();
    if (!phone) { setErr(phoneInput, phoneErr, "请输入手机号"); return; }
    if (!/^1\d{10}$/.test(phone)) { setErr(phoneInput, phoneErr, "请输入正确的 11 位手机号"); return; }
    setErr(phoneInput, phoneErr, "");
    UI.countdown(sendBtn, 60);
    UI.toast("验证码已发送");
  });

  /* 协议链接占位（阻止默认行为，避免误触勾选框） */
  UI.$$("[data-agree]").forEach(function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      UI.toast("原型占位：" + a.dataset.agree + "暂未接入", "warn");
    });
  });

  /* 注册提交 */
  document.getElementById("reg-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var phone = phoneInput.value.trim();
    var code = codeInput.value.trim();
    var pwd = pwdInput.value;
    var pwd2 = pwd2Input.value;
    var ok = true;

    if (!phone) { setErr(phoneInput, phoneErr, "请输入手机号"); ok = false; }
    else if (!/^1\d{10}$/.test(phone)) { setErr(phoneInput, phoneErr, "请输入正确的 11 位手机号"); ok = false; }
    else setErr(phoneInput, phoneErr, "");

    if (!code) { setErr(codeInput, codeErr, "请输入验证码"); ok = false; }
    else if (!/^\d{6}$/.test(code)) { setErr(codeInput, codeErr, "请输入 6 位验证码"); ok = false; }
    else setErr(codeInput, codeErr, "");

    if (!pwd) { setErr(pwdInput, pwdErr, "请设置密码"); ok = false; }
    else if (pwd.length < 6 || pwd.length > 20) { setErr(pwdInput, pwdErr, "密码长度需为 6-20 位"); ok = false; }
    else setErr(pwdInput, pwdErr, "");

    if (!pwd2) { setErr(pwd2Input, pwd2Err, "请再次输入密码"); ok = false; }
    else if (pwd2 !== pwd) { setErr(pwd2Input, pwd2Err, "两次输入的密码不一致"); ok = false; }
    else setErr(pwd2Input, pwd2Err, "");

    if (!ok) return;

    if (!agreeInput.checked) {
      UI.toast("请先阅读并同意《用户协议》和《隐私政策》", "warn");
      return;
    }

    UI.toast("注册成功，欢迎加入云枢智学");
    YS.auth.login(DB.user);
    setTimeout(function () { location.href = "profile.html"; }, 700);
  });
})();
</script>
</body>
</html>
