<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据看板 · 云枢智学管理后台</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<style>
  /* 页面特有样式 */
  .chart-card .line-chart { height: auto; }
</style>
</head>
<body class="admin-body" data-page="dashboard">
<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <div class="admin-main">
    <header class="admin-topbar" id="admin-topbar"></header>
    <main class="admin-content">

      <!-- 统计卡片 -->
      <div class="stat-card-grid">
        <div class="card stat-card">
          <div class="stat-top"><span class="stat-label">学科数量</span><span class="stat-icon">📚</span></div>
          <div class="stat-value" id="stat-subjects">9</div>
          <div class="stat-sub up">↑ 12% 较上周</div>
        </div>
        <div class="card stat-card">
          <div class="stat-top"><span class="stat-label">题目数量</span><span class="stat-icon">📝</span></div>
          <div class="stat-value" id="stat-questions">384</div>
          <div class="stat-sub up">↑ 8% 较上周</div>
        </div>
        <div class="card stat-card">
          <div class="stat-top"><span class="stat-label">注册用户</span><span class="stat-icon">👥</span></div>
          <div class="stat-value" id="stat-users">23,186</div>
          <div class="stat-sub up">↑ 3% 较上周</div>
        </div>
        <div class="card stat-card">
          <div class="stat-top"><span class="stat-label">AI面试次数</span><span class="stat-icon">🤖</span></div>
          <div class="stat-value" id="stat-interviews">96,432</div>
          <div class="stat-sub down">↓ 2% 较上周</div>
        </div>
      </div>

      <!-- 快捷操作 -->
      <div class="card mb-16">
        <div class="card-header"><h3 class="card-title">快捷操作</h3></div>
        <div class="card-body quick-actions">
          <a class="btn" href="routes.html">🗺️ 管理学习路线</a>
          <a class="btn btn-primary" href="routes.html?new=1">➕ 创建新路线</a>
          <a class="btn" href="courses.html">🎬 B站课程库</a>
        </div>
      </div>

      <!-- 图表区 -->
      <div class="chart-2col mb-16">
        <div class="card chart-card">
          <div class="card-header">
            <h3 class="card-title">用户增长趋势</h3>
            <div class="segmented" id="growth-range">
              <button type="button" data-range="7" class="active">7 天</button>
              <button type="button" data-range="30">30 天</button>
              <button type="button" data-range="90">90 天</button>
            </div>
          </div>
          <div class="card-body">
            <svg class="line-chart" id="growth-chart" viewBox="0 0 720 240" role="img" aria-label="用户增长趋势折线图"></svg>
          </div>
        </div>

        <div class="card chart-card">
          <div class="card-header"><h3 class="card-title">题目学科分布</h3></div>
          <div class="card-body">
            <div class="bar-chart" id="subject-bars"></div>
          </div>
        </div>
      </div>

      <!-- 最近活动 -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">最近活动</h3>
          <a class="btn btn-sm" href="logs.html">查看全部</a>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr><th>用户</th><th>操作</th><th>详情</th><th>时间</th></tr>
            </thead>
            <tbody id="log-rows"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- 统计卡片（学科 / 题目取自 DB 汇总） ---------- */
  document.getElementById("stat-subjects").textContent = DB.subjects.length;
  document.getElementById("stat-questions").textContent =
    DB.subjectDist.reduce(function (a, b) { return a + b.count; }, 0).toLocaleString("en-US");

  /* ---------- 图表 1：用户增长趋势（inline SVG 折线图，切换范围重绘） ---------- */
  var svg = document.getElementById("growth-chart");

  // 数值域取整齐刻度
  function niceScale(lo, hi, ticks) {
    if (hi === lo) { hi = lo + 1; }
    var raw = (hi - lo) / ticks;
    var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var norm = raw / mag;
    var step = mag * (norm >= 5 ? 5 : norm >= 2 ? 2 : 1);
    var nlo = Math.floor(lo / step) * step;
    var nhi = Math.ceil(hi / step) * step;
    return { lo: nlo, hi: nhi, step: step };
  }

  function drawGrowth(range) {
    var data = DB.userGrowth[range] || [];
    if (!data.length) { svg.innerHTML = ""; return; }

    var W = 720, H = 240, padL = 48, padR = 14, padT = 16, padB = 36;
    var plotW = W - padL - padR, plotH = H - padT - padB, plotBottom = H - padB;

    var vals = data.map(function (d) { return d.value; });
    var rawMin = Math.min.apply(null, vals), rawMax = Math.max.apply(null, vals);
    if (rawMin === rawMax) { rawMin -= 1; rawMax += 1; }
    var pad = (rawMax - rawMin) * 0.14;
    var sc = niceScale(rawMin - pad, rawMax + pad, 4);

    function X(i) { return data.length === 1 ? padL + plotW / 2 : padL + i * plotW / (data.length - 1); }
    function Y(v) { return padT + (sc.hi - v) / (sc.hi - sc.lo) * plotH; }

    var parts = [];

    // 淡色水平网格线 + y 轴刻度
    for (var g = sc.lo; g <= sc.hi + 1e-6; g += sc.step) {
      var gy = Y(g);
      parts.push('<line class="grid-line" x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '"/>');
      parts.push('<text class="axis-label" x="' + (padL - 8) + '" y="' + (gy + 4) + '" text-anchor="end">' +
        Math.round(g).toLocaleString("en-US") + "</text>");
    }

    // 面积填充 + 折线（2px）
    var pts = data.map(function (d, i) { return X(i) + "," + Y(d.value); });
    parts.push('<path class="data-area" d="M' + pts.join(" L") + " L" + X(data.length - 1) + "," + plotBottom +
      " L" + X(0) + "," + plotBottom + ' Z"/>');
    parts.push('<path class="data-line" d="M' + pts.join(" L") + '"/>');

    // x 轴标签（抽稀：7 天全显，30 天隔 6 个，90 天隔 15 个）
    var lblStep = range === 90 ? 15 : range === 30 ? 6 : 1;
    data.forEach(function (d, i) {
      if (i % lblStep !== 0 && i !== data.length - 1) return;
      parts.push('<text class="axis-label" x="' + X(i) + '" y="' + (H - 12) + '" text-anchor="middle">' +
        UI.esc(d.label) + "</text>");
    });

    // 数据点（r=4，白描边）+ 每点悬浮提示
    var dotStep = range === 90 ? 3 : 1;
    data.forEach(function (d, i) {
      var tip = "<b>" + d.value + "</b> 人 · " + UI.esc(d.label);
      if (i % dotStep === 0 || i === data.length - 1) {
        parts.push('<circle class="data-dot" cx="' + X(i) + '" cy="' + Y(d.value) + '" r="4" data-tip="' + tip + '"/>');
      }
      parts.push('<circle cx="' + X(i) + '" cy="' + Y(d.value) + '" r="8" fill="transparent" pointer-events="all" data-tip="' + tip + '"/>');
    });

    svg.innerHTML = parts.join("");
  }

  // 切换 7 天 / 30 天 / 90 天
  var rangeBox = document.getElementById("growth-range");
  rangeBox.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-range]");
    if (!b) return;
    rangeBox.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    b.classList.add("active");
    drawGrowth(parseInt(b.dataset.range, 10));
  });
  drawGrowth(7);

  /* ---------- 图表 2：题目学科分布（柱状图） ---------- */
  var dist = DB.subjectDist;
  var maxCount = Math.max.apply(null, dist.map(function (d) { return d.count; }));
  document.getElementById("subject-bars").innerHTML = dist.map(function (d) {
    var h = Math.round(d.count / maxCount * 140);
    return '<div class="bar-col" data-tip="<b>' + UI.esc(d.fullName) + "</b> · " + d.count + ' 题">' +
      '<div class="bar" style="height:' + h + "px;flex-shrink:0" + '"></div>' +
      '<div class="bar-label">' + UI.esc(d.name) + "</div></div>";
  }).join("");

  /* ---------- 最近活动（前 6 条） ---------- */
  document.getElementById("log-rows").innerHTML = DB.logs.slice(0, 6).map(function (l) {
    return "<tr><td>" + UI.esc(l.user) + "</td><td>" + UI.esc(l.action) + "</td><td class=\"text-2\">" +
      UI.esc(l.target) + "</td><td class=\"muted nowrap\">" + UI.esc(l.time) + "</td></tr>";
  }).join("");
})();
</script>
</body>
</html>
