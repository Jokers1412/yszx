<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>操作日志 - 云枢智学</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<style>
  #log-table tbody tr { cursor: pointer; }
  .filter-bar .input[type="date"] { width: 150px; }
  .date-sep { color: var(--ink-3); }
</style>
</head>
<body class="admin-body" data-page="logs">
<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <div class="admin-main">
    <header class="admin-topbar" id="admin-topbar"></header>
    <main class="admin-content">

      <div class="filter-bar">
        <input class="input search-input" id="f-kw" type="text" placeholder="搜索用户 / 操作 / 目标">
        <select class="select" id="f-type">
          <option value="all">全部</option>
          <option value="login">登录</option>
          <option value="create">新增·创建·上传</option>
          <option value="update">修改·编辑</option>
          <option value="delete">删除</option>
          <option value="toggle">禁用·启用</option>
          <option value="other">其他</option>
        </select>
        <input class="input" type="date" id="f-start" title="开始日期" aria-label="开始日期">
        <span class="date-sep">至</span>
        <input class="input" type="date" id="f-end" title="结束日期" aria-label="结束日期">
      </div>

      <div class="toolbar-row">
        <div class="toolbar-right">
          <button class="btn" id="btn-export">导出日志</button>
          <button class="btn btn-soft-danger" id="btn-clear">清空日志</button>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="table" id="log-table">
            <thead>
              <tr>
                <th>用户</th>
                <th>操作</th>
                <th>目标</th>
                <th>IP地址</th>
                <th>时间</th>
              </tr>
            </thead>
            <tbody id="log-tbody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pager"></div>
      </div>

    </main>
  </div>
</div>

<!-- 日志详情弹窗 -->
<div class="modal-overlay" id="detail-modal" hidden>
  <div class="modal">
    <div class="modal-header">
      <h3>日志详情</h3>
      <button class="modal-close" data-close>×</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-footer">
      <button class="btn" data-close>关闭</button>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- 数据：从 DB 拷贝到内存操作 ---------- */
  function cloneArr(arr) {
    return arr.map(function (o) { var c = {}; for (var k in o) c[k] = o[k]; return c; });
  }
  var logs = cloneArr(DB.logs);
  var filters = { kw: "", type: "all", start: "", end: "" };
  var page = 1, pageSize = 8;

  function find(id) {
    for (var i = 0; i < logs.length; i++) if (logs[i].id === id) return logs[i];
    return null;
  }
  function filtered() {
    var kw = filters.kw.trim().toLowerCase();
    return logs.filter(function (l) {
      if (filters.type !== "all" && l.type !== filters.type) return false;
      var day = String(l.time).slice(0, 10);
      if (filters.start && day < filters.start) return false;
      if (filters.end && day > filters.end) return false;
      if (kw) {
        var hay = (l.user + " " + l.action + " " + l.target).toLowerCase();
        if (hay.indexOf(kw) < 0) return false;
      }
      return true;
    });
  }

  /* ---------- 列表渲染 ---------- */
  function render() {
    var rows = filtered();
    var total = rows.length;
    var pages = Math.max(1, Math.ceil(total / pageSize));
    if (page > pages) page = pages;
    var slice = rows.slice((page - 1) * pageSize, page * pageSize);

    var html = slice.map(function (l) {
      return '<tr data-id="' + l.id + '">' +
        "<td>" + UI.esc(l.user) + "</td>" +
        "<td>" + UI.esc(l.action) + "</td>" +
        "<td>" + UI.esc(l.target) + "</td>" +
        "<td>" + UI.esc(l.ip) + "</td>" +
        '<td class="nowrap">' + UI.esc(l.time) + "</td>" +
        "</tr>";
    }).join("");

    if (!slice.length) {
      html = '<tr><td colspan="5"><div class="empty-state">' +
        '<div class="empty-icon">🔍</div>' +
        '<div class="empty-title">暂无匹配的日志记录</div>' +
        "</div></td></tr>";
    }
    UI.$("#log-tbody").innerHTML = html;

    UI.pager(UI.$("#pager"), {
      total: total, page: page, pageSize: pageSize,
      onChange: function (p) { page = p; render(); }
    });
  }

  /* ---------- 行详情弹窗 ---------- */
  function openDetail(id) {
    var l = find(id);
    if (!l) return;
    UI.$("#detail-body").innerHTML =
      '<dl class="desc-list">' +
        "<dt>操作用户</dt><dd>" + UI.esc(l.user) + "</dd>" +
        "<dt>操作类型</dt><dd>" + UI.esc(DB.logTypeLabel[l.type] || l.type) + "</dd>" +
        "<dt>操作对象</dt><dd>" + UI.esc(l.target) + "</dd>" +
        "<dt>IP地址</dt><dd>" + UI.esc(l.ip) + "</dd>" +
        "<dt>操作时间</dt><dd>" + UI.esc(l.time) + "</dd>" +
        "<dt>日志ID</dt><dd>" + UI.esc(l.id) + "</dd>" +
      "</dl>";
    UI.openModal("detail-modal");
  }

  /* ---------- 导出 CSV（Blob 下载，带 BOM 防 Excel 乱码） ---------- */
  function csvCell(v) {
    return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  }
  function exportCsv() {
    var rows = filtered();
    var lines = [csvCell("用户") + "," + csvCell("操作") + "," + csvCell("目标") + "," + csvCell("IP地址") + "," + csvCell("时间")];
    rows.forEach(function (l) {
      lines.push([l.user, l.action, l.target, l.ip, l.time].map(csvCell).join(","));
    });
    var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "操作日志.csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    UI.toast("已导出 " + rows.length + " 条日志（CSV）");
  }

  /* ---------- 清空日志 ---------- */
  function clearLogs() {
    UI.confirm({ title: "清空日志", text: "确定要清空全部操作日志吗？", okText: "清空", danger: true })
      .then(function (ok) {
        if (!ok) return;
        logs = [];
        page = 1;
        render();
        UI.toast("日志已清空");
      });
  }

  /* ---------- 事件 ---------- */
  UI.$("#f-kw").addEventListener("input", UI.debounce(function () {
    filters.kw = UI.$("#f-kw").value;
    page = 1;
    render();
  }, 250));
  UI.$("#f-type").addEventListener("change", function () {
    filters.type = this.value;
    page = 1;
    render();
  });
  UI.$("#f-start").addEventListener("change", function () {
    filters.start = this.value;
    page = 1;
    render();
  });
  UI.$("#f-end").addEventListener("change", function () {
    filters.end = this.value;
    page = 1;
    render();
  });
  UI.$("#log-tbody").addEventListener("click", function (e) {
    var tr = e.target.closest("tr[data-id]");
    if (tr) openDetail(tr.dataset.id);
  });
  UI.$("#btn-export").addEventListener("click", exportCsv);
  UI.$("#btn-clear").addEventListener("click", clearLogs);

  render();
})();
</script>
</body>
</html>
