<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色管理 - 云枢智学</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<style>
  code.role-code {
    font-size: 12px; color: var(--ink-3); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px;
    font-family: Consolas, Monaco, monospace;
  }
  .role-card .role-usercount { font-size: 12px; color: var(--ink-3); margin: 6px 0; }
  .role-card .role-desc { font-size: 13px; color: var(--ink-2); margin: 0 0 4px; min-height: 40px; }
  .perm-group .pg-title { display: flex; align-items: center; gap: 16px; }
  .perm-group .pg-title .pg-name { min-width: 96px; }
</style>
</head>
<body class="admin-body" data-page="roles">
<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <div class="admin-main">
    <header class="admin-topbar" id="admin-topbar"></header>
    <main class="admin-content">

      <div class="toolbar-row">
        <div class="toolbar-right">
          <button class="btn btn-primary" id="btn-add">+ 新增角色</button>
        </div>
      </div>

      <div class="role-grid" id="role-grid"></div>

    </main>
  </div>
</div>

<!-- 编辑权限弹窗 -->
<div class="modal-overlay" id="perm-modal" hidden>
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 id="perm-modal-title">编辑权限</h3>
      <button class="modal-close" data-close>×</button>
    </div>
    <div class="modal-body">
      <div class="perm-tree" id="perm-tree"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" data-close>取消</button>
      <button class="btn btn-primary" id="btn-save-perm">保存</button>
    </div>
  </div>
</div>

<!-- 新增角色弹窗 -->
<div class="modal-overlay" id="role-modal" hidden>
  <div class="modal">
    <div class="modal-header">
      <h3>新增角色</h3>
      <button class="modal-close" data-close>×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-label">角色名称<span class="req">*</span></label>
        <input class="input" id="r-name" type="text" placeholder="请输入角色名称">
        <div class="field-error" id="err-name"></div>
      </div>
      <div class="field">
        <label class="field-label">角色编码<span class="req">*</span></label>
        <input class="input" id="r-code" type="text" placeholder="请输入角色编码">
        <div class="field-hint">保存时校验唯一性，如 content_reviewer</div>
        <div class="field-error" id="err-code"></div>
      </div>
      <div class="field mb-0">
        <label class="field-label">角色描述</label>
        <textarea class="textarea" id="r-desc" placeholder="选填"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" data-close>取消</button>
      <button class="btn btn-primary" id="btn-save-role">保存</button>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- 数据：从 DB 拷贝到内存操作 ---------- */
  function cloneArr(arr) {
    return arr.map(function (o) { var c = {}; for (var k in o) c[k] = o[k]; return c; });
  }
  var roles = cloneArr(DB.roles);
  var permTree = DB.permTree;   // 9 组 33 项，只读
  var editingId = null;
  var nextSeq = 100;

  function find(id) {
    for (var i = 0; i < roles.length; i++) if (roles[i].id === id) return roles[i];
    return null;
  }

  /* ---------- 角色卡片渲染 ---------- */
  function permTagsHtml(r) {
    if (r.all) return '<span class="badge badge-blue">全部权限</span>';
    if (!r.perms || !r.perms.length) return '<span class="badge badge-gray">暂无权限</span>';
    var show = r.perms.slice(0, 8).map(function (p) {
      return '<span class="badge">' + UI.esc(p) + "</span>";
    }).join("");
    if (r.perms.length > 8) show += '<span class="badge badge-gray">+' + (r.perms.length - 8) + "</span>";
    return show;
  }
  function renderRoles() {
    var grid = UI.$("#role-grid");
    if (!roles.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">' +
        '<div class="empty-icon">🛡️</div>' +
        '<div class="empty-title">暂无角色数据，点击右上角新增角色</div>' +
        "</div>";
      return;
    }
    grid.innerHTML = roles.map(function (r) {
      var canDel = r.userCount === 0;
      return '<div class="role-card card" data-id="' + r.id + '">' +
        '<div class="flex-between"><h3 class="card-title">' + UI.esc(r.name) + '</h3><code class="role-code">' + UI.esc(r.code) + "</code></div>" +
        '<div class="role-usercount">用户数：' + r.userCount + "</div>" +
        '<p class="role-desc">' + (r.desc ? UI.esc(r.desc) : '<span class="muted">暂无描述</span>') + "</p>" +
        '<div class="perm-tags">' + permTagsHtml(r) + "</div>" +
        '<div class="flex gap-8 mt-16">' +
          '<button class="btn btn-sm" data-act="perm">编辑权限</button>' +
          '<button class="btn btn-sm btn-soft-danger" data-act="del"' +
            (canDel ? "" : ' disabled title="该角色下有用户，不可删除"') + ">删除</button>" +
        "</div></div>";
    }).join("");
  }

  /* ---------- 权限树弹窗 ---------- */
  function permKey(group, perm) { return group + "·" + perm; }
  function renderPermTree(r) {
    var readonly = !!r.all;
    var checked = {};
    if (r.all) {
      permTree.forEach(function (g) {
        g.perms.forEach(function (p) { checked[permKey(g.group, p)] = true; });
      });
    } else {
      (r.perms || []).forEach(function (p) { checked[p] = true; });
    }
    UI.$("#perm-tree").innerHTML = permTree.map(function (g) {
      var allChecked = g.perms.every(function (p) { return checked[permKey(g.group, p)]; });
      var items = g.perms.map(function (p) {
        var key = permKey(g.group, p);
        return '<label class="checkbox-row"><input type="checkbox" data-perm="' + UI.esc(key) + '"' +
          (checked[key] ? " checked" : "") + (readonly ? " disabled" : "") + ">" + UI.esc(p) + "</label>";
      }).join("");
      return '<div class="perm-group">' +
        '<div class="pg-title"><span class="pg-name">' + UI.esc(g.group) + "</span>" +
          '<label class="checkbox-row"><input type="checkbox" data-group="' + UI.esc(g.group) + '"' +
          (allChecked ? " checked" : "") + (readonly ? " disabled" : "") + ">全选该组</label></div>" +
        '<div class="perm-items">' + items + "</div></div>";
    }).join("");
    UI.$("#btn-save-perm").disabled = readonly;
  }
  function syncGroup(group) {
    var root = UI.$("#perm-tree");
    var items = UI.$$('input[data-perm]', root).filter(function (p) {
      return p.dataset.perm.split("·")[0] === group;
    });
    var gb = UI.$$('input[data-group]', root).filter(function (g) {
      return g.dataset.group === group;
    })[0];
    if (!gb) return;
    var all = items.length > 0 && items.every(function (p) { return p.checked; });
    var some = items.some(function (p) { return p.checked; });
    gb.checked = all;
    gb.indeterminate = !all && some;
  }
  function openPerm(id) {
    var r = find(id);
    if (!r) return;
    editingId = id;
    UI.$("#perm-modal-title").textContent = "编辑权限 - " + r.name;
    renderPermTree(r);
    UI.openModal("perm-modal");
  }
  function savePerm() {
    var r = find(editingId);
    if (!r) return;
    UI.confirm({ title: "编辑权限", text: "保存将全量覆盖该角色权限", okText: "保存" }).then(function (ok) {
      if (!ok) return;
      var perms = [];
      UI.$$("#perm-tree input[data-perm]").forEach(function (p) {
        if (p.checked) perms.push(p.dataset.perm);
      });
      r.perms = perms;
      UI.closeModal("perm-modal");
      UI.toast("保存成功");
      renderRoles();
    });
  }

  /* ---------- 新增角色 ---------- */
  function saveRole() {
    var name = UI.$("#r-name").value.trim();
    var code = UI.$("#r-code").value.trim();
    var desc = UI.$("#r-desc").value.trim();
    UI.$("#err-name").textContent = "";
    UI.$("#err-code").textContent = "";
    UI.$("#r-name").classList.remove("error");
    UI.$("#r-code").classList.remove("error");
    var errs = [];
    if (!name) { UI.$("#err-name").textContent = "请输入角色名称"; UI.$("#r-name").classList.add("error"); errs.push("请输入角色名称"); }
    if (!code) {
      UI.$("#err-code").textContent = "请输入角色编码";
      UI.$("#r-code").classList.add("error");
      errs.push("请输入角色编码");
    } else if (roles.some(function (r) { return r.code === code; })) {
      UI.$("#err-code").textContent = "角色编码已存在";
      UI.$("#r-code").classList.add("error");
      errs.push("角色编码已存在");
    }
    if (errs.length) { UI.toast(errs[0], "error"); return; }

    var id = "role-" + (++nextSeq);
    while (find(id)) id = "role-" + (++nextSeq);
    roles.push({ id: id, name: name, code: code, desc: desc, userCount: 0, all: false, perms: [] });
    UI.closeModal("role-modal");
    UI.toast("新增成功");
    renderRoles();
  }

  /* ---------- 删除角色 ---------- */
  function delRole(id) {
    var r = find(id);
    if (!r) return;
    if (r.userCount > 0) { UI.toast("该角色下有用户，不可删除", "warn"); return; }
    UI.confirm({ title: "删除角色", text: "确定要删除角色「" + r.name + "」吗？", okText: "删除", danger: true })
      .then(function (ok) {
        if (!ok) return;
        roles = roles.filter(function (x) { return x.id !== id; });
        UI.toast("已删除");
        renderRoles();
      });
  }

  /* ---------- 事件 ---------- */
  UI.$("#role-grid").addEventListener("click", function (e) {
    var card = e.target.closest(".role-card");
    if (!card) return;
    var btn = e.target.closest("[data-act]");
    if (btn) {
      if (btn.dataset.act === "perm") openPerm(card.dataset.id);
      else if (btn.dataset.act === "del") delRole(card.dataset.id);
      return;
    }
    openPerm(card.dataset.id);   // 点击卡片空白处 → 编辑权限
  });
  UI.$("#perm-tree").addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.group) {
      UI.$$('input[data-perm]', UI.$("#perm-tree")).forEach(function (p) {
        if (p.dataset.perm.split("·")[0] === t.dataset.group) p.checked = t.checked;
      });
      syncGroup(t.dataset.group);
    } else if (t.dataset && t.dataset.perm) {
      syncGroup(t.dataset.perm.split("·")[0]);
    }
  });
  UI.$("#btn-save-perm").addEventListener("click", savePerm);
  UI.$("#btn-add").addEventListener("click", function () {
    UI.$("#r-name").value = "";
    UI.$("#r-code").value = "";
    UI.$("#r-desc").value = "";
    UI.$("#err-name").textContent = "";
    UI.$("#err-code").textContent = "";
    UI.$("#r-name").classList.remove("error");
    UI.$("#r-code").classList.remove("error");
    UI.openModal("role-modal");
  });
  UI.$("#btn-save-role").addEventListener("click", saveRole);

  renderRoles();
})();
</script>
</body>
</html>
